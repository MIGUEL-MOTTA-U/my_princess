[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-princess"
version = "0.1.0"
description = "AI-agent pipeline that documents proxy videos: watchfolder -> transcription -> LLM metadata -> human validation queue"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1,<2",
    "pydantic>=2.7",
    "litellm>=1.50",
    "python-dotenv>=1.0",
    "imageio-ffmpeg>=0.5",
    "faster-whisper>=1.0",
    "pymongo>=4.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mongomock>=4.1",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/my_princess"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
